name: Reusable Frontend Tests

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used in the caller repository.
        type: string
        required: false
        default: "20"
      install-command:
        description: Install command for the caller repository.
        type: string
        required: false
        default: npm ci
      build-command:
        description: Build command for the caller repository.
        type: string
        required: false
        default: npm run build
      lint-command:
        description: Lint command for the caller repository.
        type: string
        required: false
        default: npm run lint
      start-command:
        description: Start command for the caller application.
        type: string
        required: false
        default: npm run start:prod -- --host 127.0.0.1 --port 4173
      base-url:
        description: Base URL where the started application is reachable.
        type: string
        required: false
        default: http://127.0.0.1:4173
      urls:
        description: Comma-separated routes to test, or 'auto' for sitemap-based discovery.
        type: string
        required: false
        default: auto
      grep:
        description: Optional Playwright grep expression.
        type: string
        required: false
        default: ""
      working-directory:
        description: Working directory of the caller frontend project.
        type: string
        required: false
        default: .
      enable-lighthouse:
        description: Enable lighthouse checks (true/false).
        type: boolean
        required: false
        default: false

jobs:
  dependency_review:
    name: Dependency Review
    uses: ./.github/workflows/reusable-dependency-review.yml

  dependencies:
    name: Dependencies
    uses: ./.github/workflows/reusable-dependencies.yml
    with:
      node-version: ${{ inputs.node-version }}
      install-command: ${{ inputs.install-command }}
      working-directory: ${{ inputs.working-directory }}

  npm_build:
    name: NPM Build
    needs: dependencies
    uses: ./.github/workflows/reusable-npm-build.yml
    with:
      node-version: ${{ inputs.node-version }}
      install-command: ${{ inputs.install-command }}
      working-directory: ${{ inputs.working-directory }}
      build-command: ${{ inputs.build-command }}

  pr_lint:
    name: PR Lint
    needs: dependencies
    uses: ./.github/workflows/reusable-pr-lint.yml
    with:
      node-version: ${{ inputs.node-version }}
      install-command: ${{ inputs.install-command }}
      working-directory: ${{ inputs.working-directory }}
      lint-command: ${{ inputs.lint-command }}

  npm_test:
    name: NPM Test
    needs:
      - dependencies
      - npm_build
      - pr_lint
    uses: ./.github/workflows/reusable-npm-test.yml
    with:
      node-version: ${{ inputs.node-version }}
      install-command: ${{ inputs.install-command }}
      working-directory: ${{ inputs.working-directory }}
      build-command: ${{ inputs.build-command }}
      start-command: ${{ inputs.start-command }}
      base-url: ${{ inputs.base-url }}
      urls: ${{ inputs.urls }}
      grep: ${{ inputs.grep }}
      enable-lighthouse: ${{ inputs.enable-lighthouse }}

  checks:
    name: Checks
    if: ${{ always() }}
    needs:
      - dependency_review
      - dependencies
      - npm_build
      - pr_lint
      - npm_test
    uses: ./.github/workflows/reusable-checks.yml
    with:
      dependency-review-result: ${{ needs.dependency_review.result }}
      dependencies-result: ${{ needs.dependencies.result }}
      npm-build-result: ${{ needs.npm_build.result }}
      pr-lint-result: ${{ needs.pr_lint.result }}
      npm-test-result: ${{ needs.npm_test.result }}
