name: Reusable PR Lint

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: "20"
      install-command:
        type: string
        required: false
        default: npm ci
      working-directory:
        type: string
        required: false
        default: .
      lint-command:
        type: string
        required: false
        default: auto

jobs:
  pr_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install caller dependencies
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}

      - name: Run lint
        working-directory: ${{ inputs.working-directory }}
        env:
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: |
          set -euo pipefail

          if [[ -z "${LINT_COMMAND// }" || "$LINT_COMMAND" == "auto" ]]; then
            echo "Running default frontend-flows lint (Prettier + Biome via npx)."
            npx --yes prettier@3 --check --ignore-unknown --no-error-on-unmatched-pattern .
            npx --yes @biomejs/biome@1.9.4 lint .
            exit 0
          fi

          echo "Running lint command: $LINT_COMMAND"
          bash -lc "$LINT_COMMAND"
